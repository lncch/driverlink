<text x="737.0" y="241.5" font-size="16.5" fill="#E8EFEA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Manual CV screening</text>
<line x1="915" y1="40" x2="1070" y2="285" stroke="#2E9E72" stroke-width="2.5"/>
<text x="915" y="23" font-size="22" font-weight="700" fill="#2E9E72" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Information</text>
