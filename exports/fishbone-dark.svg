<svg xmlns="http://www.w3.org/2000/svg" width="1615" height="612" viewBox="0 0 1615 612">
<title>Fishbone cause and effect diagram for the HireWheel problem: six cause categories feeding one effect</title>
<rect x="0" y="0" width="1615" height="612" fill="#101413"/>
<g transform="translate(-62.5,20.6)">
<line x1="90" y1="285" x2="1290" y2="285" stroke="#E8EFEA" stroke-width="3"/>
<polygon points="1290,273 1318,285 1290,297" fill="#E8EFEA"/>
<rect x="1330" y="192" width="320" height="186" rx="7" fill="#8E3A2C" stroke="#5E241A" stroke-width="2"/>
<text x="1356" y="238" font-size="21" font-weight="600" fill="#FBFAF7" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Qualified drivers in Saudi</text>
<text x="1356" y="270" font-size="21" font-weight="600" fill="#FBFAF7" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Arabia and the companies</text>
<text x="1356" y="302" font-size="21" font-weight="600" fill="#FBFAF7" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">that need them do not</text>
<text x="1356" y="334" font-size="21" font-weight="600" fill="#FBFAF7" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">reliably find each other.</text>
<line x1="275" y1="40" x2="430" y2="285" stroke="#2E9E72" stroke-width="2.5"/>
<text x="275" y="23" font-size="22" font-weight="700" fill="#2E9E72" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Drivers</text>
<line x1="321.5" y1="113.5" x2="332.5" y2="113.5" stroke="#3A4A43" stroke-width="2"/>
<text x="339.5" y="119.0" font-size="16.5" fill="#E8EFEA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Rely on word of mouth</text>
<line x1="360.3" y1="174.8" x2="371.3" y2="174.8" stroke="#3A4A43" stroke-width="2"/>
<text x="378.3" y="180.3" font-size="16.5" fill="#E8EFEA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">No structured path to next job</text>
