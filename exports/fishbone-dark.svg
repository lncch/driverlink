<line x1="275" y1="530" x2="430" y2="285" stroke="#2E9E72" stroke-width="2.5"/>
<text x="275" y="560" font-size="22" font-weight="700" fill="#2E9E72" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Technology</text>
<line x1="321.5" y1="456.5" x2="332.5" y2="456.5" stroke="#3A4A43" stroke-width="2"/>
<text x="339.5" y="462.0" font-size="16.5" fill="#E8EFEA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Job boards ignore licences</text>
<line x1="360.3" y1="395.3" x2="371.3" y2="395.3" stroke="#3A4A43" stroke-width="2"/>
<text x="378.3" y="400.8" font-size="16.5" fill="#E8EFEA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Single-category driver limit</text>
<line x1="399.0" y1="334.0" x2="410.0" y2="334.0" stroke="#3A4A43" stroke-width="2"/>
<text x="417.0" y="339.5" font-size="16.5" fill="#E8EFEA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">No direct driver–company platform</text>
<line x1="595" y1="530" x2="750" y2="285" stroke="#2E9E72" stroke-width="2.5"/>
<text x="595" y="560" font-size="22" font-weight="700" fill="#2E9E72" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Trust</text>
<line x1="641.5" y1="456.5" x2="652.5" y2="456.5" stroke="#3A4A43" stroke-width="2"/>
<text x="659.5" y="462.0" font-size="16.5" fill="#E8EFEA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">No identity verification</text>
<line x1="680.3" y1="395.3" x2="691.3" y2="395.3" stroke="#3A4A43" stroke-width="2"/>
<text x="698.3" y="400.8" font-size="16.5" fill="#E8EFEA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">No commercial-record check</text>
<line x1="719.0" y1="334.0" x2="730.0" y2="334.0" stroke="#3A4A43" stroke-width="2"/>
<text x="737.0" y="339.5" font-size="16.5" fill="#E8EFEA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">No history on either side</text>
<line x1="915" y1="530" x2="1070" y2="285" stroke="#2E9E72" stroke-width="2.5"/>
<text x="915" y="560" font-size="22" font-weight="700" fill="#2E9E72" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Market</text>
<line x1="961.5" y1="456.5" x2="972.5" y2="456.5" stroke="#3A4A43" stroke-width="2"/>
<text x="979.5" y="462.0" font-size="16.5" fill="#E8EFEA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Neglecting local driver talent</text>
<line x1="1000.3" y1="395.3" x2="1011.3" y2="395.3" stroke="#3A4A43" stroke-width="2"/>
<text x="1018.3" y="400.8" font-size="16.5" fill="#E8EFEA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Saudization targets unmet</text>
<line x1="1039.0" y1="334.0" x2="1050.0" y2="334.0" stroke="#3A4A43" stroke-width="2"/>
<text x="1057.0" y="339.5" font-size="16.5" fill="#E8EFEA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Residency transfer complications</text>
