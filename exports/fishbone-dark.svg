<text x="417.0" y="241.5" font-size="16.5" fill="#E8EFEA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Cannot compare employers</text>
<line x1="595" y1="40" x2="750" y2="285" stroke="#2E9E72" stroke-width="2.5"/>
<text x="595" y="23" font-size="22" font-weight="700" fill="#2E9E72" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Companies</text>
<line x1="641.5" y1="113.5" x2="652.5" y2="113.5" stroke="#3A4A43" stroke-width="2"/>
<text x="659.5" y="119.0" font-size="16.5" fill="#E8EFEA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Hiring by personal networks</text>
<line x1="680.3" y1="174.8" x2="691.3" y2="174.8" stroke="#3A4A43" stroke-width="2"/>
<text x="698.3" y="180.3" font-size="16.5" fill="#E8EFEA" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Ads reach the wrong people</text>
